/* Triton — Android shell.
 * A Trusted Web Activity: Chrome renders the live site full screen with no
 * address bar, so what ships inside the app is whatever the site serves. That
 * is why a deploy reaches phones without anybody reinstalling, and why this
 * project only changes when the icon, name or version does.
 */
plugins { id "com.android.application" }

android {
    namespace "in.triton.bookings"
    compileSdk 34

    defaultConfig {
        applicationId "in.triton.bookings"
        minSdk 23
        targetSdk 34
        versionCode (project.findProperty("tritonVersionCode") ?: "1").toString().toInteger()
        versionName (project.findProperty("tritonVersionName") ?: "1.0.0").toString()
        manifestPlaceholders = [
            hostName    : "mis2ibaadatenterprises.github.io",
            defaultUrl  : "https://mis2ibaadatenterprises.github.io/triton-bookings/",
            launcherName: "Triton"
        ]
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty("tritonKeystore") ?: "../../android/android.keystore")
            storePassword project.findProperty("tritonStorePassword") ?: ""
            keyAlias "triton"
            keyPassword project.findProperty("tritonKeyPassword") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
