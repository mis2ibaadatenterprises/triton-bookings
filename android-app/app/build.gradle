/* Triton — Android shell.
 * A Trusted Web Activity: Chrome renders the live site full screen with no
 * address bar, so what ships inside the app is whatever the site serves. That
 * is why a deploy reaches phones without anybody reinstalling, and why this
 * project only changes when the icon, name or version does.
 */
plugins { id "com.android.application" }

/* Read as variables first. Written inline, Groovy binds the parentheses to the
   versionCode/versionName call rather than to the expression, and the build
   fails with "Value is null". */
def tritonVersionName = (project.findProperty("tritonVersionName") ?: "1.0.0").toString()
def tritonVersionCode = Integer.parseInt((project.findProperty("tritonVersionCode") ?: "1").toString())
def tritonKeystorePath = (project.findProperty("tritonKeystore") ?: "../../android/android.keystore").toString()
def tritonStorePw = (project.findProperty("tritonStorePassword") ?: "").toString()
def tritonKeyPw = (project.findProperty("tritonKeyPassword") ?: "").toString()

android {
    namespace "in.triton.bookings"
    compileSdk 34

    defaultConfig {
        applicationId "in.triton.bookings"
        minSdk 23
        targetSdk 34
        versionCode tritonVersionCode
        versionName tritonVersionName
        manifestPlaceholders = [
            hostName    : "mis2ibaadatenterprises.github.io",
            defaultUrl  : "https://mis2ibaadatenterprises.github.io/triton-bookings/",
            launcherName: "Triton"
        ]
    }

    signingConfigs {
        release {
            storeFile file(tritonKeystorePath)
            storePassword tritonStorePw
            keyAlias "triton"
            keyPassword tritonKeyPw
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
