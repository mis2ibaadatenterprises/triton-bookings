name: Release Triton (APK + Windows installer)

# Produces the two permanent download links:
#   .../releases/latest/download/Triton.apk
#   .../releases/latest/download/Triton-Setup-<version>.exe
# The APK file name never changes, so the "latest" link stays valid forever and
# can be pasted into the setup message once.
#
# Run it by pushing a tag:   git tag v1.0.0 && git push origin v1.0.0
# or from the Actions tab:   Run workflow → type the version.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions),
# created once by android/make-keystore.sh:
#   ANDROID_KEYSTORE_BASE64   the signing key, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - name: Check the signing key is configured
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::No signing key. Run android/make-keystore.sh and add the three secrets it prints."
            exit 1
          fi

      - name: Restore the signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore
          ls -l android/android.keystore

      - name: Record the key fingerprint
        id: fp
        run: |
          FP=$(keytool -list -v -keystore android/android.keystore -alias triton \
               -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
               | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' \r')
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "Signing key SHA256: $FP"

      - name: Publish the app-to-site link (assetlinks.json)
        # Without this the Android app shows a browser address bar across the top.
        run: |
          cat > app/.well-known/assetlinks.json <<JSON
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "in.triton.bookings",
                "sha256_cert_fingerprints": ["${{ steps.fp.outputs.fingerprint }}"]
              }
            }
          ]
          JSON
          if ! git diff --quiet app/.well-known/assetlinks.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/.well-known/assetlinks.json
            git commit -m "Link the Android app to the site (signing key fingerprint)"
            git push origin HEAD:main
          fi

      - name: Build the APK and the Play bundle
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease \
            -PtritonVersionName="${{ needs.version.outputs.version }}" \
            -PtritonVersionCode="${GITHUB_RUN_NUMBER}" \
            -PtritonKeystore="${GITHUB_WORKSPACE}/android/android.keystore" \
            -PtritonStorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PtritonKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"
          # Fixed names, so the "latest/download" links never go stale.
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Triton.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
             "$GITHUB_WORKSPACE/Triton-play-${{ needs.version.outputs.version }}.aab"
          ls -lh "$GITHUB_WORKSPACE"/Triton.apk "$GITHUB_WORKSPACE"/Triton-play-*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Triton.apk
            Triton-play-*.aab

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Build the Windows installer
        working-directory: desktop
        run: |
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
          npm install
          npm run dist
          dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Triton-Setup-*.exe

  release:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: ls -R out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Triton ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            **Android** — open this on the phone:
            https://github.com/${{ github.repository }}/releases/latest/download/Triton.apk

            **iPhone** — open this in Safari, then Share → Add to Home Screen:
            https://mis2ibaadatenterprises.github.io/triton-bookings/

            **Windows** — installer:
            https://github.com/${{ github.repository }}/releases/latest/download/Triton-Setup-${{ needs.version.outputs.version }}.exe

            Phones that already have the app do not need to reinstall. They pick up
            changes on the next open, and show an Update bar if the app is already open.

            `Triton-play-*.aab` is for uploading to the Play Console, not for phones.
          files: |
            out/android/Triton.apk
            out/android/Triton-play-*.aab
            out/windows/Triton-Setup-*.exe
